name: Object snippets

# The object snippets under snippets/objects are generated from
# openapi.public.json. A spec sync that lands without regenerating them leaves
# the pages showing the previous shapes, so the check fails the pull request
# until `node scripts/gen-objects.mjs` has been run and its output committed.
#
# The sync PR from final-net/Final's docs-sync workflow is the exception: it
# copies only the spec, so the regenerate job commits the snippets onto its
# branch instead. That commit is pushed with GITHUB_TOKEN, which starts no
# workflow run, so the sync PR's head shows no result for this check. If this
# check is ever made required, the push needs the sync app's token instead, or
# the sync PR can never merge.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  objects:
    name: snippets match the spec
    if: github.head_ref != 'sync/openapi-spec'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/gen-objects.mjs
      - name: Fail on drift
        run: |
          git diff --exit-code -- snippets/objects || (echo "object snippets drift from openapi.public.json: run 'node scripts/gen-objects.mjs' and commit the result"; exit 1)

  regenerate:
    name: regenerate snippets on the spec sync
    if: github.event_name == 'pull_request' && github.head_ref == 'sync/openapi-spec'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    # A newer sync push supersedes this run, and its own run regenerates from
    # the newer spec.
    concurrency:
      group: regenerate-snippets
      cancel-in-progress: true
    steps:
      # The branch, not the PR's merge commit, which is detached and cannot be
      # pushed back.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: sync/openapi-spec
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/gen-objects.mjs
      - name: Commit the regenerated snippets
        run: |
          if [ -z "$(git status --porcelain -- snippets/objects)" ]; then
            echo "snippets already match the spec"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snippets/objects
          git commit -m "regenerate the object snippets from the synced spec"
          git push origin HEAD:sync/openapi-spec
